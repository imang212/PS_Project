version: '3.8'
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ps_project_api
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api
      - ./Utils.py:/app/Utils.py
      - ./RemoteUtils.py:/app/RemoteUtils.py
      - ./docker_simulation/logs:/app/logs
      - ./docker_simulation/data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - HAILO_ENABLED=true
      - CAMERA_SIMULATION=true
      - SERVO_SIMULATION=true
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
    depends_on:
      - mqtt
      - postgres
    networks:
      - ps_network
    privileged: true
    devices:
      - /dev/video0:/dev/video0  # Camera device (if available)
      - /dev/gpiomem:/dev/gpiomem  # GPIO access
    restart: unless-stopped

  ai_pipeline:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    container_name: ps_project_pipeline
    volumes:
      - ./pipeline:/app/pipeline
      - ./docker_simulation/data:/app/data
      - ./docker_simulation/models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
      - HAILO_ENABLED=true
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
      - VIDEO_SOURCE=/app/data/test_video.mp4
    depends_on:
      - mqtt
    networks:
      - ps_network
    privileged: true
    restart: unless-stopped

  hardware:
    build:
      context: .
      dockerfile: Dockerfile.hardware
    container_name: ps_project_hardware
    volumes:
      - ./hardware:/app/hardware
      - ./tests:/app/tests
    environment:
      - PYTHONUNBUFFERED=1
      - SERVO_SIMULATION=true
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
    depends_on:
      - mqtt
    networks:
      - ps_network
    privileged: true
    devices:
      - /dev/gpiomem:/dev/gpiomem
    restart: unless-stopped

  camera_simulator:
    build:
      context: .
      dockerfile: Dockerfile.camera
    container_name: ps_project_camera
    ports:
      - "8554:8554"  # RTSP stream port
    volumes:
     - ./docker_simulation/data:/app/data
      - ./Tests:/app/Tests
    environment:
      - PYTHONUNBUFFERED=1
      - RTSP_PORT=8554
      - CAMERA_WIDTH=1080
      - CAMERA_HEIGHT=720
      - CAMERA_FPS=25
    networks:
      - ps_network
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: ps_project_mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker_simulation/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mqtt_data:/mosquitto/data
      - mqtt_logs:/mosquitto/log
      - mqtt_spy:/pipeline/mqtt_spy.py
    networks:
      - ps_network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: ps_project_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=ps_project
      - POSTGRES_USER=ps_user
      - POSTGRES_PASSWORD=ps_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker_simulation/config/init_hailo.sql:/docker-entrypoint-initdb.d/init_hailo.sql
    networks:
      - ps_network
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: ps_project_dashboard
    ports:
      - "8501"
    volumes:
      - ./docs:/usr/share/nginx/html/docs
    depends_on:
      - api
    networks:
      - ps_network
    restart: unless-stopped

networks:
  ps_network:
    driver: bridge

volumes:
  mqtt_data:
  mqtt_logs:
  postgres_data: